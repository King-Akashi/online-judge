spring.application.name=submission-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/submissions}
spring.datasource.username=${DATABASE_USERNAME:submission_service}
spring.datasource.password=${DATABASE_PASSWORD:${SUBMISSION_DB_PASSWORD:submission-local}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:minijudge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:minijudge-local}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
minijudge.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
minijudge.outbox.confirm-timeout-ms=${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=MiniJudge Submission Service
info.app.version=@project.version@
