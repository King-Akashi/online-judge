spring.application.name=problem-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/problems}
spring.datasource.username=${DATABASE_USERNAME:problem_service}
spring.datasource.password=${DATABASE_PASSWORD:${PROBLEM_DB_PASSWORD:problem-local}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
minijudge.internal-api-key=${MINIJUDGE_INTERNAL_API_KEY:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=MiniJudge Problem Service
info.app.version=@project.version@
