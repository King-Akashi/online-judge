spring.application.name=judge-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/judge}
spring.datasource.username=${DATABASE_USERNAME:judge_service}
spring.datasource.password=${DATABASE_PASSWORD:${JUDGE_DB_PASSWORD:judge-local}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:minijudge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:minijudge-local}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
minijudge.problem-service.url=${PROBLEM_SERVICE_URL:http://localhost:8081}
minijudge.internal-api-key=${MINIJUDGE_INTERNAL_API_KEY:}
minijudge.execution.docker-command=${DOCKER_COMMAND:docker}
minijudge.execution.image=${RUNNER_IMAGE:minijudge/java-runner:21}
minijudge.execution.compile-timeout-ms=${COMPILE_TIMEOUT_MS:15000}
minijudge.execution.max-output-bytes=${MAX_OUTPUT_BYTES:1048576}
minijudge.execution.pids-limit=${EXECUTION_PIDS_LIMIT:64}
minijudge.execution.cpus=${EXECUTION_CPUS:1}
minijudge.recovery.stale-after-minutes=${STALE_JOB_MINUTES:5}
minijudge.recovery.poll-interval-ms=${RECOVERY_POLL_INTERVAL_MS:60000}
minijudge.result-outbox.poll-interval-ms=${RESULT_OUTBOX_POLL_INTERVAL_MS:1000}
minijudge.result-outbox.confirm-timeout-ms=${RESULT_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=MiniJudge Judge Service
info.app.version=@project.version@
